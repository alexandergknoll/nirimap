name: Set up build environment
description: >-
  Install the Rust toolchain, restore cargo caches, and install the GTK4 and
  gtk4-layer-shell build dependencies. gtk4-layer-shell is not packaged for
  Ubuntu 24.04, so it is built from a pinned upstream release commit.

inputs:
  components:
    description: Extra rustup components to install (comma-separated), e.g. "clippy"
    required: false
    default: ""
  cache-key:
    description: Cache key segment for the cargo target directory
    required: false
    default: build

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-05
      with:
        toolchain: stable
        components: ${{ inputs.components }}

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-${{ inputs.cache-key }}-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev meson ninja-build libwayland-dev wayland-protocols gobject-introspection libgirepository1.0-dev git

    - name: Build and install gtk4-layer-shell (pinned)
      shell: bash
      env:
        # wmww/gtk4-layer-shell v1.3.0. Fetching by commit SHA (rather than a
        # branch or tag) means a compromised or force-pushed upstream ref
        # cannot change what gets built and installed on the runner.
        GTK4_LAYER_SHELL_COMMIT: 1c963c51514581c41b9bdae08cdf69171265cdda
      run: |
        set -euo pipefail
        mkdir gtk4-layer-shell && cd gtk4-layer-shell
        git init -q
        git remote add origin https://github.com/wmww/gtk4-layer-shell.git
        git fetch -q --depth 1 origin "$GTK4_LAYER_SHELL_COMMIT"
        git -c advice.detachedHead=false checkout -q FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GTK4_LAYER_SHELL_COMMIT"
        meson setup build -Dprefix=/usr -Dvapi=false -Dintrospection=false -Ddocs=false -Dexamples=false
        meson compile -C build
        sudo meson install -C build
