name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # sign the build provenance attestation via Sigstore
      attestations: write # store the attestation alongside the repo
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-key: release

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package binary
        run: |
          cd target/release
          tar czf ../../nirimap-${{ github.ref_name }}-x86_64-linux.tar.gz nirimap
          cd ../..
          sha256sum nirimap-${{ github.ref_name }}-x86_64-linux.tar.gz > nirimap-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256

      # Publishes a signed SLSA provenance statement tying the tarball to this
      # exact workflow run, commit, and repository. Users can check it with:
      #   gh attestation verify nirimap-<tag>-x86_64-linux.tar.gz --owner alexandergknoll
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nirimap-${{ github.ref_name }}-x86_64-linux.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            nirimap-${{ github.ref_name }}-x86_64-linux.tar.gz
            nirimap-${{ github.ref_name }}-x86_64-linux.tar.gz.sha256
